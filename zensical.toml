[project]
site_name = "cuPDLPx"
site_url = "https://mit-lu-lab.github.io/cuPDLPx/"
site_description = "Documentation for cuPDLPx, an open-source, GPU-accelerated first-order solver for large-scale linear programming."
site_author = "Haihao Lu, Zedong Peng, Jinwen Yang, and contributors"
copyright = '&copy; 2025–2026 <a href="https://github.com/MIT-Lu-Lab">MIT Lu Lab</a> · <a href="https://github.com/MIT-Lu-Lab/cuPDLPx/blob/main/LICENSE">Apache License 2.0</a><br>Website made with <a href="https://zensical.org/">Zensical</a>'
repo_url = "https://github.com/MIT-Lu-Lab/cuPDLPx"
repo_name = "MIT-Lu-Lab/cuPDLPx"
edit_uri = "edit/main/docs/"
docs_dir = "docs"
site_dir = "site"
extra_css = [
  "https://unpkg.com/katex@0.18.4/dist/katex.min.css",
  "stylesheets/extra.css",
]
extra_javascript = [
  "javascripts/katex.js",
  "https://unpkg.com/katex@0.18.4/dist/katex.min.js",
  "https://unpkg.com/katex@0.18.4/dist/contrib/auto-render.min.js",
]

nav = [
  { "Home" = "index.md" },
  { "Get started" = [
    { "Overview" = "getting-started/index.md" },
    { "Python interface" = "guides/python.md" },
    { "Julia interface" = "guides/julia.md" },
    { "Command-line interface" = "guides/command-line.md" },
    { "C interface" = "guides/c-api.md" },
    { "Log interpretation" = "getting-started/log-interpretation.md" },
    { "Results and status" = "getting-started/results.md" },
  ] },
  { "Algorithm" = [
    { "Overview" = "algorithm/index.md" },
    { "Base algorithm" = "algorithm/base-algorithm.md" },
    { "Presolve and postsolve" = "algorithm/presolve.md" },
    { "Preconditioning" = "algorithm/preconditioning.md" },
    { "Step size" = "algorithm/step-size.md" },
    { "Adaptive restart" = "algorithm/restart.md" },
    { "Primal weight" = "algorithm/primal-weight.md" },
    { "Termination criteria" = "algorithm/termination.md" },
    { "Feasibility polishing" = "algorithm/feasibility-polishing.md" },
  ] },
  { "Implementation" = [
    { "Overview" = "implementation/index.md" },
    { "GPU backends" = "implementation/gpu-backends.md" },
    { "SpMV" = "implementation/sparse-matrix-vector-products.md" },
    { "Kernel fusion" = "implementation/kernel-fusion.md" },
    { "CUDA Graphs" = "implementation/cuda-graphs.md" },
  ] },
  { "Parameters" = "reference/parameters.md" },
  { "Citation" = "citation.md" },
]

[project.theme]
font = false
variant = "modern"
language = "en"
favicon = "assets/mit-favicon.svg"
features = [
  "content.action.edit",
  "content.action.view",
  "content.code.copy",
  "content.code.select",
  "content.tabs.link",
  "content.tooltips",
  "navigation.footer",
  "navigation.indexes",
  "navigation.instant",
  "navigation.instant.prefetch",
  "navigation.path",
  "navigation.sections",
  "navigation.tabs",
  "navigation.tabs.sticky",
  "navigation.top",
  "navigation.tracking",
  "search.highlight",
  "toc.follow",
]

[project.theme.icon]
repo = "fontawesome/brands/github"
edit = "material/pencil"
view = "material/eye"

[project.extra]
generator = false

[[project.theme.palette]]
media = "(prefers-color-scheme)"
toggle.icon = "lucide/sun-moon"
toggle.name = "Use light theme"

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
toggle.icon = "lucide/sun"
toggle.name = "Use dark theme"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
toggle.icon = "lucide/moon"
toggle.name = "Use system theme"

[[project.extra.social]]
icon = "fontawesome/brands/github"
link = "https://github.com/MIT-Lu-Lab/cuPDLPx"
name = "cuPDLPx on GitHub"

[[project.extra.social]]
icon = "fontawesome/solid/cube"
link = "https://pypi.org/project/cupdlpx/"
name = "cuPDLPx on PyPI"

[project.validation]
invalid_links = true
invalid_link_anchors = true
unresolved_references = true
unresolved_footnotes = true

[project.markdown_extensions]
abbr = {}
admonition = {}
attr_list = {}
def_list = {}
footnotes = {}
md_in_html = {}
toc.permalink = true
pymdownx.arithmatex.generic = true
pymdownx.details = {}
pymdownx.highlight.anchor_linenums = true
pymdownx.highlight.line_spans = "__span"
pymdownx.highlight.pygments_lang_class = true
pymdownx.inlinehilite = {}
pymdownx.superfences.custom_fences = [
  { name = "mermaid", class = "mermaid", format = "pymdownx.superfences.fence_code_format" },
]
pymdownx.tabbed.alternate_style = true
pymdownx.tabbed.combine_header_slug = true
pymdownx.tasklist.custom_checkbox = true

[project.plugins.offline]
